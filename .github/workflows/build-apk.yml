
name: Build svi.app APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'svi_app_android_studio_projesi.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -q svi_app_android_studio_projesi.zip -d .
          test -f svi_app_android/build.gradle
          test -f svi_app_android/app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: svi_app_android
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: svi-app-apk
          path: svi_app_android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
